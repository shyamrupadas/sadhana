name: Deploy App

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/api-contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/contract.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  checks: read

concurrency:
  group: sadhana-web-release
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and verify API contract
        run: |
          pnpm --filter @sadhana/api-contract generate
          git diff --exit-code -- packages/api-contract/generated/
          test -z "$(git ls-files --others --exclude-standard -- packages/api-contract/generated/)"

      - name: Lint web
        run: pnpm --filter @sadhana/web lint

      - name: Typecheck web
        run: pnpm exec turbo run typecheck --filter=@sadhana/web

      - name: Build web
        run: pnpm build:web

      - name: Verify production artifact and API URL
        run: |
          test -s apps/web/dist/index.html
          api_url="$(sed -n 's/^VITE_API_BASE_URL=//p' apps/web/.env.production)"
          test -n "$api_url"
          grep -Fq -- "$api_url" apps/web/dist/assets/*.js

      - name: Require successful CI for this commit
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            conclusion="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name == "workspace-and-image")] | sort_by(.started_at) | last | .conclusion // "pending"')"
            case "$conclusion" in
              success) exit 0 ;;
              failure|cancelled|timed_out|action_required|skipped|neutral)
                echo "CI finished with conclusion: $conclusion" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo 'CI did not finish within 15 minutes' >&2
          exit 1

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/master'
        env:
          SERVER_IP: ${{ vars.SERVER_IP }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SERVER_IP"
          test -n "$SERVER_USER"
          test -n "$SSH_KNOWN_HOSTS"
          test -n "$SSH_PRIVATE_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/id_rsa -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            apps/web/dist/ "$SERVER_USER@$SERVER_IP:/var/www/sadhana-app/html/"

      - name: Smoke check web and API
        if: github.ref == 'refs/heads/master'
        run: |
          api_url="$(sed -n 's/^VITE_API_BASE_URL=//p' apps/web/.env.production)"
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --max-time 30 https://app.sadhana-tracker.com/ > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 --max-time 30 "$api_url/" > /dev/null
